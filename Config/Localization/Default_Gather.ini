;METADATA=(Diff=true, UseCommands=true)
[CommonSettings]
SourcePath=Content/Localization/Default
DestinationPath=Content/Localization/Default
ManifestName=Default.manifest
ArchiveName=Default.archive
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=zh

[GatherTextStep0]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/Blueprints/UI/*
ExcludePathFilters=Content/Localization/*
